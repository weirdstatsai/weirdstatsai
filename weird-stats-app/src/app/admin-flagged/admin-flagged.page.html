<ion-header class="ion-no-border">
  <ion-toolbar class="admin-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="back()" class="back-btn">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <div class="admin-title-wrap">
      <ion-icon name="flag-outline" class="title-icon"></ion-icon>
      <ion-title class="admin-title">Flagged</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="admin-content">

  <div class="loading-state" *ngIf="isLoading">
    <ion-spinner name="dots"></ion-spinner>
    <p>Loading reports…</p>
  </div>

  <ng-container *ngIf="!isLoading">
    <div class="tab-body">
      <div class="flagged-list">
        <div class="flagged-item" *ngFor="let c of flaggedCards">
          <div class="f-info">
            <p class="f-title">{{ c.data?.title }}</p>
            <p class="f-meta">{{ c.createdByName || 'Unknown' }} · {{ c.flagCount }} reports</p>
          </div>
          <div class="f-actions">
            <button class="f-btn ok" (click)="dismissFlag(c.id)" title="Dismiss">
              <ion-icon name="checkmark-outline"></ion-icon>
            </button>
            <button class="f-btn del" (click)="deleteCard(c.id)" title="Delete">
              <ion-icon name="trash-outline"></ion-icon>
            </button>
          </div>
        </div>
        <div class="flagged-empty" *ngIf="flaggedCards.length === 0">
          <ion-icon name="checkmark-circle-outline"></ion-icon>
          <p>No flagged content</p>
        </div>
      </div>
    </div>
  </ng-container>

</ion-content>
