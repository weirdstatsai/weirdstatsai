<div class="sheet">
  <div class="handle"></div>

  <div class="header">
    <p class="eyebrow">Publishing</p>
    <h2 class="title">Who can see this card?</h2>
  </div>

  <div class="options">

    <button class="option" (click)="choose('public')">
      <div class="option-icon public">
        <ion-icon name="earth-outline"></ion-icon>
      </div>
      <div class="option-text">
        <p class="option-name">Public</p>
        <p class="option-desc">Visible to everyone on the Explore feed</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="option-arrow"></ion-icon>
    </button>

    <button class="option premium" (click)="choose('private')">
      <div class="option-icon private">
        <ion-icon name="link-outline"></ion-icon>
      </div>
      <div class="option-text">
        <p class="option-name">Private <span class="premium-tag">Premium</span></p>
        <p class="option-desc">Only accessible via a shareable link</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="option-arrow"></ion-icon>
    </button>

  </div>

  <button class="cancel-btn" (click)="dismiss()">Cancel</button>
</div>
