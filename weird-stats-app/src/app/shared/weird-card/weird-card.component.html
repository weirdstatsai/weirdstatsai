<app-card-kpi *ngIf="renderChartAsComparison" [card]="comparisonCard" [size]="size" kpiStyle="comparison"></app-card-kpi>
<ng-container *ngIf="!renderChartAsComparison" [ngSwitch]="card.cardType">
  <app-card-ranking *ngSwitchCase="'ranking'" [card]="card" [size]="size" [rankStyle]="rankStyle"></app-card-ranking>
  <!-- KPI is the one type kept on the premium story card (it reads far better
       as a big hero number); every other type uses its original light card. -->
  <app-story-card   *ngSwitchCase="'kpi'"     [card]="card" [size]="size"></app-story-card>
  <app-card-versus  *ngSwitchCase="'versus'"  [card]="card" [size]="size" [versusStyle]="versusStyle"></app-card-versus>
  <app-card-fact    *ngSwitchCase="'fact'"    [card]="card" [size]="size" [factStyle]="factStyle"></app-card-fact>
  <app-card-chart   *ngSwitchCase="'chart'"   [card]="card" [size]="size"></app-card-chart>
  <app-card-table   *ngSwitchCase="'table'"   [card]="card" [size]="size" [tableStyle]="tableStyle"></app-card-table>
  <app-card-map     *ngSwitchCase="'map'"     [card]="card" [size]="size" [mapStyle]="mapStyle"></app-card-map>
  <!-- fallback for unknown types -->
  <app-card-fact *ngSwitchDefault [card]="card" [size]="size" [factStyle]="factStyle"></app-card-fact>
</ng-container>
