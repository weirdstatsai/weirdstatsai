<ion-content>

  <!-- Sticky category + search header -->
  <div class="sticky-header">
    <div class="category-chips">
      <div
        *ngFor="let c of categories"
        class="category-chip"
        [class.active]="activeCategory === c.id"
        (click)="setCategory(c.id)">
        <span class="chip-emoji">{{ c.emoji }}</span>{{ c.label }}
      </div>
    </div>

    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input
        [(ngModel)]="searchQuery"
        type="search"
        placeholder="Search cards or people…"
        class="search-input"
        (input)="onSearchChange()" />
      <ion-icon name="close-circle" *ngIf="searchQuery.trim()" class="search-clear" (click)="searchQuery=''; onSearchChange()"></ion-icon>
    </div>
  </div>

  <!-- Loading skeleton -->
  <div class="feed" *ngIf="isLoading">
    <div class="skeleton-card skeleton-featured"></div>
    <div class="skeleton-card skeleton-mini"></div>
    <div class="skeleton-card skeleton-mini"></div>
    <div class="skeleton-card skeleton-featured"></div>
    <div class="skeleton-card skeleton-mini"></div>
    <div class="skeleton-card skeleton-mini"></div>
  </div>

  <!-- Feed -->
  <div class="feed" *ngIf="!isLoading && filteredCards.length > 0; else noResults">
    <div class="card-tile"
         *ngFor="let card of filteredCards; let i = index"
         [class.span-full]="isFullWidth(card)"
         (click)="open(card)">
      <app-weird-card [card]="card.data" size="feed"></app-weird-card>
    </div>
  </div>

  <!-- Profile search results — shown above no-results when profiles match -->
  <div class="profile-results" *ngIf="searchQuery && matchingProfiles.length > 0">
    <p class="profile-results-label">People</p>
    <div class="profile-chip" *ngFor="let p of matchingProfiles" (click)="openProfile(p.uid)">
      <div class="profile-chip-avatar">{{ p.name.charAt(0).toUpperCase() }}</div>
      <div class="profile-chip-info">
        <p class="profile-chip-name">{{ p.name }}</p>
        <p class="profile-chip-count">{{ p.cardCount }} card{{ p.cardCount !== 1 ? 's' : '' }}</p>
      </div>
      <ion-icon name="chevron-forward-outline" class="profile-chip-arrow"></ion-icon>
    </div>
  </div>

  <ng-template #noResults>
    <div class="no-results" *ngIf="!isLoading && matchingProfiles.length === 0">
      <div class="no-results-icon">
        <ion-icon name="search-outline"></ion-icon>
      </div>
      <p class="no-results-title" *ngIf="searchQuery">No matches for "{{ searchQuery }}"</p>
      <p class="no-results-title" *ngIf="!searchQuery">No cards yet</p>
      <p class="no-results-sub" *ngIf="searchQuery">Try a different card title or person's name</p>
      <p class="no-results-sub" *ngIf="!searchQuery">Published cards will show up here</p>
    </div>
  </ng-template>

</ion-content>
