<!-- Plain outlet + standalone tab bar instead of <ion-tabs>: IonTabs cannot
     live at an empty route path (it derives its tabsPrefix from the loaded
     child URL, breaking stack ids, transitions and tab selection), and the
     tabs route sits at '' so tab URLs stay clean (/home, /explore, /profile). -->
<div class="tabs-outlet">
  <ion-router-outlet></ion-router-outlet>
</div>
<ion-tab-bar>
  <ion-tab-button [selected]="active === 'home'" (click)="go('home')">
    <ion-icon name="home"></ion-icon>
    <ion-label>Home</ion-label>
  </ion-tab-button>
  <ion-tab-button [selected]="active === 'explore'" (click)="go('explore')">
    <ion-icon name="search"></ion-icon>
    <ion-label>Explore</ion-label>
  </ion-tab-button>
  <ion-tab-button [selected]="active === 'profile'" (click)="go('profile')">
    <ion-icon name="person"></ion-icon>
    <ion-label>Profile</ion-label>
  </ion-tab-button>
</ion-tab-bar>
